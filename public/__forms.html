<!DOCTYPE html>
<html>
  <head><meta charset="utf-8" /><title>Form Detection</title></head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field">
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="hidden" name="traffic_source" />
      <input type="hidden" name="landing_url" />
    </form>
    <form name="get-assessment" data-netlify="true" netlify-honeypot="bot-field">
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="company-name" />
      <input type="text" name="call-handling-gap" />
      <input type="hidden" name="traffic_source" />
      <input type="hidden" name="landing_url" />
    </form>
  </body>
</html>
